<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a2332;
      --muted: #4a5568;
      --accent: #c45c26;
      --surface: #f7f3ee;
      --line: #d9d0c4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 10% 0%, #e8ddd0 0%, transparent 45%),
        radial-gradient(ellipse at 90% 100%, #dce8e4 0%, transparent 40%),
        var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 36rem);
    }

    h1 {
      font-family: "Source Serif 4", serif;
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 1.75rem;
      letter-spacing: -0.02em;
      opacity: 0;
      transform: translateY(12px);
      animation: rise-in 0.7s ease-out forwards;
    }

    ol {
      list-style: none;
      counter-reset: item;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    li {
      counter-increment: item;
      display: flex;
      align-items: baseline;
      gap: 0.85rem;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--muted);
      padding-bottom: 0.85rem;
      border-bottom: 1px solid var(--line);
      opacity: 0;
      transform: translateY(14px);
      animation: rise-in 0.55s ease-out forwards;
      transition: color 0.25s ease, transform 0.25s ease;
    }

    li:nth-child(1) { animation-delay: 0.2s; }
    li:nth-child(2) { animation-delay: 0.35s; }
    li:nth-child(3) { animation-delay: 0.5s; }

    li:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    li:hover {
      color: var(--ink);
      transform: translateX(6px);
    }

    li::before {
      content: counter(item);
      flex-shrink: 0;
      width: 1.6rem;
      height: 1.6rem;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      border-radius: 0.35rem;
      transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
    }

    li:hover::before {
      background: var(--accent);
      color: #fff;
      transform: scale(1.08);
    }

    @keyframes rise-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      h1,
      li {
        opacity: 1;
        transform: none;
        animation: none;
      }

      li:hover,
      li:hover::before {
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Генератор идей для постов</h1>
    <ol>
      <li>5 идей постов для экспертов</li>
      <li>3 идеи сторис на сегодня</li>
      <li>Контент-план на неделю</li>
    </ol>
  </main>
</body>
</html>
